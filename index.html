<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PC Power</title>
<meta name="theme-color" content="#002b36">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PC">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<!--
  Power-on button for the PC. Sends "wake" / "status" to a secret ntfy.sh
  topic that the Pico W polls, and shows its replies from <topic>-status
  live. The topic is never in this file: it comes from the URL hash
  (#<topic>), so the page itself can be public. The hash stays in the URL
  because a home-screen icon gets its own storage and must carry it.
-->
<style>
:root {
  --bg:#002b36; --surface:#073642; --border:#586e75; --text:#93a1a1; --text2:#839496; --muted:#657b83;
  --accent:#2aa198; --ok:#859900; --bad:#dc322f; --warn:#b58900;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg:#fdf6e3; --surface:#eee8d5; --border:#93a1a1; --text:#586e75; --text2:#657b83; --muted:#839496;
  }
}
* { box-sizing:border-box; margin:0; padding:0; }
html, body { height:100%; }
body {
  background:var(--bg); color:var(--text);
  font-family:"SF Mono", Consolas, "Hiragino Sans", "Noto Sans JP", monospace;
  display:flex; align-items:center; justify-content:center;
  padding:max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
}
.box { width:100%; max-width:380px; text-align:center; }
h1 { font-size:.8rem; letter-spacing:.2em; color:var(--muted); font-weight:600; margin-bottom:28px; }
#state { display:flex; align-items:center; justify-content:center; gap:10px; font-size:1.05rem; margin-bottom:32px; min-height:1.6em; }
.dot { width:11px; height:11px; border-radius:50%; background:var(--border); flex-shrink:0; }
.dot.up { background:var(--ok); box-shadow:0 0 0 4px color-mix(in srgb, var(--ok) 25%, transparent); }
.dot.down { background:var(--bad); }
.dot.wait { background:var(--warn); animation:pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity:.35; } }
#power {
  width:168px; height:168px; border-radius:50%; margin:0 auto 28px; display:flex; align-items:center; justify-content:center;
  background:var(--surface); border:2px solid var(--border); color:var(--accent); cursor:pointer;
  transition:transform .08s, border-color .15s, color .15s;
  -webkit-tap-highlight-color:transparent;
}
#power:active:not(:disabled) { transform:scale(.96); }
#power:hover:not(:disabled) { border-color:var(--accent); }
#power:disabled { color:var(--muted); cursor:default; opacity:.6; }
#power svg { width:72px; height:72px; }
#msg { font-size:.8rem; color:var(--text2); min-height:1.3em; margin-bottom:22px; }
#log { list-style:none; text-align:left; font-size:.72rem; color:var(--muted); border-top:1px solid var(--surface); padding-top:12px; }
#log li { display:flex; gap:10px; padding:3px 0; }
#log time { flex-shrink:0; }
.links { margin-top:18px; font-size:.75rem; display:flex; gap:16px; justify-content:center; }
.links a, .links button { color:var(--accent); background:none; border:none; font:inherit; cursor:pointer; text-decoration:none; }
#setup { display:none; }
#setup p { font-size:.85rem; line-height:1.7; color:var(--text2); }
</style>
</head>
<body>
<main class="box" id="app">
  <h1>PC POWER</h1>
  <div id="state"><span class="dot" id="dot"></span><span id="label">確認中…</span></div>
  <button id="power" type="button" aria-label="起動する" onclick="wake()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v9"/><path d="M6.3 6.3a8 8 0 1 0 11.4 0"/></svg>
  </button>
  <div id="msg"></div>
  <ul id="log"></ul>
  <div class="links"><button type="button" onclick="checkStatus()">状態を確認</button><a id="hub" href="https://hyt-x570.tailb37dae.ts.net/">Hub を開く</a></div>
</main>
<main class="box" id="setup">
  <h1>PC POWER</h1>
  <p>このページは、設定済みのリンク（# 付きの URL）から開いてください。</p>
</main>
<script>
const NTFY = "https://ntfy.sh/";
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch { return null; } }
const fromHash = decodeURIComponent(location.hash.slice(1));
if (/^[\w-]{12,64}$/.test(fromHash)) store("topic", fromHash);
const TOPIC = /^[\w-]{12,64}$/.test(fromHash) ? fromHash : store("topic");

const $ = id => document.getElementById(id);
let waitingSince = 0;
function setState(kind, text) { $("dot").className = "dot " + kind; $("label").textContent = text; }
function addLog(t, text) {
  const li = document.createElement("li");
  li.innerHTML = `<time>${new Date(t * 1000).toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit" })}</time><span></span>`;
  li.lastChild.textContent = text;
  $("log").prepend(li);
  while ($("log").children.length > 6) $("log").lastChild.remove();
}
// Interpret one reply from the Pico W.
function onReply(m) {
  addLog(m.time, m.message);
  const s = m.message;
  if (/起動中|すでに起動|起動しました/.test(s)) { waitingSince = 0; setState("up", "起動中"); $("power").disabled = true; $("msg").textContent = ""; }
  else if (/停止/.test(s)) { setState("down", "停止中"); $("power").disabled = false; }
  else if (/合図を送りました/.test(s)) { waitingSince = Date.now(); setState("wait", "起動しています…"); $("msg").textContent = "1〜2分かかります"; }
  else if (/確認できませんでした/.test(s)) { waitingSince = 0; setState("down", "起動を確認できませんでした"); $("power").disabled = false; $("msg").textContent = "もう一度押すか、時間をおいて試してください"; }
}
async function send(cmd) {
  const r = await fetch(NTFY + TOPIC, { method: "POST", body: cmd }).catch(() => null);
  return !!(r && r.ok);
}
async function wake() {
  $("power").disabled = true;
  setState("wait", "合図を送っています…");
  $("msg").textContent = "";
  if (!await send("wake")) { setState("down", "送信できませんでした"); $("power").disabled = false; return; }
  waitingSince = Date.now();
}
let statusTimer = null;
async function checkStatus() {
  setState("wait", "確認中…");
  if (!await send("status")) { setState("", "送信できませんでした"); return; }
  // The Pico W polls every ~10s; if nothing comes back, it's offline.
  clearTimeout(statusTimer);
  statusTimer = setTimeout(() => { if ($("label").textContent === "確認中…") setState("", "応答がありません（Pico W を確認してください）"); }, 40000);
}
function listen() {
  // Live replies (SSE); reconnects on its own after network drops.
  const es = new EventSource(NTFY + TOPIC + "-status/sse");
  es.onmessage = e => { try { const m = JSON.parse(e.data); if (m.event === "message") onReply(m); } catch {} };
}
async function loadRecent() {
  const r = await fetch(NTFY + TOPIC + "-status/json?poll=1&since=2h").then(x => x.text()).catch(() => "");
  r.split("\n").filter(Boolean).map(l => { try { return JSON.parse(l); } catch { return null; } })
    .filter(m => m && m.event === "message").slice(-6).forEach(m => addLog(m.time, m.message));
}

if (!TOPIC) { $("app").style.display = "none"; $("setup").style.display = "block"; }
else {
  loadRecent().then(() => { listen(); checkStatus(); });
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && !waitingSince) checkStatus(); });
}
</script>
</body>
</html>
